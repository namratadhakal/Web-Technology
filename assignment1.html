<!DOCTYPE html>
<html>
    <head>
        <title>navbar</title>
        <style>

            html{
                height: 100%;
            }
        body
        {
            background-color:burlywood;
        
            height:100%;
            margin:0;
            padding:0;
            display: flex;
            flex-direction: column;
            
            
        }
        #navbar{
            background-color:blanchedalmond;
            padding:0%;
            margin:0%;
            display:flex;
            justify-content: space-between;
        }
        #navlinks{
            display:flex;
            justify-content:end;
            padding-right:1%;
            align-items:center;

            width:100%;
        }

        #navlinks a{
            color: #000;
            text-decoration: none;
            padding: 4%;
        }

        #navbar a:hover{
            color:brown
        }

        #logo img{
        
          width:30%;
          height:100%;
        }

        #bigdiv
        {
            display:flex;
            justify-content: left;
            
            flex: 1;
            
             
        }


        #part1
        {
            padding:10%;
            padding-bottom: 30%;
            width:20%;
            background-color: cadetblue;
        }

        #part2
        {
            padding:5%;
            padding-bottom: 30%;

            width:20%;
            background-color:brown;
        }
        #part3
        {
            padding:10%;
            padding-bottom: 30%;
            width:20%;
            background-color:coral;
        }

        #footer
        {
            background-color:crimson;
            width:100%;
            margin-top:1%;
            padding-top:2%
            
        }
        #footer p{
            text-align: center;
    
        }
        </style>
    </head>
    <body>
        <div id="navbar">
            <div id="logo">
               <img src="https://i.pinimg.com/736x/f7/67/71/f767719e41932e15aea81dd8ab403672.jpg" alt="Cake logo">
            </div>
           <div id="navlinks">
             <a href="#" target="_blank">Home</a>
             <a href="#" target="_blank">About</a>
             <a href="#" target="_blank">Contact</a>
             <a href="#" target="_blank">Services</a>
            <a href="#" target="_blank">Blog</a>
           </div>
        </div>

<div id="bigdiv">
        <div id="part1"></div>
        <div id="part2"></div>
        <div id="part3"></div>
</div>

<footer id="footer">
    <p>&copy;2025 Best Icecream.All rights reserved.</p>
    
</footer>

    </body>
</html>
